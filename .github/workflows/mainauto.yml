name: Auto Morphe DEV - YouTube Stable Experimental Reddit ARM64

on:
  workflow_dispatch:

  schedule:
    # Every 24 hours
    # 18:17 UTC = 23:47 IST
    - cron: "17 18 * * *"

permissions:
  contents: write

env:
  PATCHES_REPO: MorpheApp/morphe-patches
  MORPHE_REPO: MorpheApp/morphe-desktop
  MICROG_REPO: MorpheApp/MicroG-RE
  APKMD_PACKAGE: apkmirror-downloader

  # ARM64 only
  ARCH: arm64-v8a


jobs:

  # =========================================================
  # 1. DETECT LATEST MORPHE DEV + SUPPORTED APP VERSIONS
  # =========================================================
  detect:
    name: Detect Morphe DEV + Versions
    runs-on: ubuntu-latest

    outputs:
      patch_tag: ${{ steps.detect.outputs.patch_tag }}
      desktop_tag: ${{ steps.detect.outputs.desktop_tag }}
      microg_tag: ${{ steps.detect.outputs.microg_tag }}
      youtube_versions: ${{ steps.versions.outputs.youtube_versions }}
      reddit_version: ${{ steps.versions.outputs.reddit_version }}

    steps:

      # -------------------------------------------------------
      # Detect latest Morphe DEV patches + Desktop DEV
      # -------------------------------------------------------
      - name: Detect latest Morphe DEV
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          echo "Detecting latest Morphe DEV patch release..."

          PATCH_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${PATCHES_REPO}/releases?per_page=100"
          )"

          PATCH_TAG="$(
            echo "$PATCH_JSON" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.draft == false)
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_TAG" ] || [ "$PATCH_TAG" = "null" ]; then
            echo "ERROR: No Morphe DEV patch release found."
            exit 1
          fi


          echo "Detecting latest Morphe Desktop DEV..."

          DESKTOP_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100"
          )"

          DESKTOP_TAG="$(
            echo "$DESKTOP_JSON" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.draft == false)
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$DESKTOP_TAG" ] || [ "$DESKTOP_TAG" = "null" ]; then
            echo "ERROR: No Morphe Desktop DEV release found."
            exit 1
          fi


          echo "Detecting latest MicroG-RE..."

          MICROG_TAG="$(
            curl -fsSL \
              "https://api.github.com/repos/${MICROG_REPO}/releases/latest" |
            jq -r '.tag_name'
          )"


          echo "patch_tag=$PATCH_TAG" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=$DESKTOP_TAG" >> "$GITHUB_OUTPUT"
          echo "microg_tag=$MICROG_TAG" >> "$GITHUB_OUTPUT"


          echo
          echo "=========================================="
          echo "Morphe DEV patches : $PATCH_TAG"
          echo "Morphe Desktop DEV  : $DESKTOP_TAG"
          echo "MicroG-RE           : $MICROG_TAG"
          echo "=========================================="


      # -------------------------------------------------------
      # Download Morphe Desktop DEV
      #
      # IMPORTANT:
      # Correct GitHub API endpoint:
      # /releases/tags/<tag>
      # -------------------------------------------------------
      - name: Download Morphe Desktop DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          DESKTOP_TAG="${{ steps.detect.outputs.desktop_tag }}"

          echo "Downloading Morphe Desktop:"
          echo "$DESKTOP_TAG"

          RELEASE_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/tags/${DESKTOP_TAG}"
          )"

          JAR_URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$JAR_URL" ] || [ "$JAR_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop DEV -all.jar not found."
            echo
            echo "Available assets:"
            echo "$RELEASE_JSON" |
              jq -r '.assets[].name'
            exit 1
          fi

          echo "JAR:"
          echo "$JAR_URL"

          curl -fL "$JAR_URL" \
            -o tools/morphe-desktop.jar

          test -s tools/morphe-desktop.jar

          echo
          echo "Morphe Desktop downloaded:"
          ls -lh tools/morphe-desktop.jar

          echo
          java -jar tools/morphe-desktop.jar --version


      # -------------------------------------------------------
      # Detect YouTube stable + experimental
      # Detect Reddit latest experimental
      # directly from Morphe DEV
      # -------------------------------------------------------
      - name: Detect supported versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          PATCH_SOURCE="https://github.com/${PATCHES_REPO}"


          # ===================================================
          # YOUTUBE
          # Stable + Experimental
          # ===================================================

          echo
          echo "=========================================="
          echo "Detecting YouTube versions..."
          echo "=========================================="

          YT_OUTPUT="$(
            java -jar tools/morphe-desktop.jar list-versions \
              --patches "$PATCH_SOURCE" \
              --prerelease \
              --include-experimental \
              --filter-package-names com.google.android.youtube
          )"

          echo "$YT_OUTPUT"


          YOUTUBE_VERSIONS="$(
            printf '%s\n' "$YT_OUTPUT" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
            sort -Vu |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
              | unique
            '
          )"


          if [ "$YOUTUBE_VERSIONS" = "[]" ]; then
            echo "ERROR: No compatible YouTube versions detected."
            exit 1
          fi


          echo
          echo "YouTube versions:"
          echo "$YOUTUBE_VERSIONS" | jq -r '.[]'


          echo "youtube_versions=$YOUTUBE_VERSIONS" \
            >> "$GITHUB_OUTPUT"


          # ===================================================
          # REDDIT
          # Latest experimental / not recommended
          # ===================================================

          echo
          echo "=========================================="
          echo "Detecting Reddit experimental versions..."
          echo "=========================================="

          REDDIT_OUTPUT="$(
            java -jar tools/morphe-desktop.jar list-versions \
              --patches "$PATCH_SOURCE" \
              --prerelease \
              --include-experimental \
              --filter-package-names com.reddit.frontpage
          )"

          echo "$REDDIT_OUTPUT"


          REDDIT_VERSION="$(
            printf '%s\n' "$REDDIT_OUTPUT" |
            grep -oE '[0-9]{4}\.[0-9]+\.[0-9]+' |
            sort -V |
            tail -n 1
          )"


          if [ -z "$REDDIT_VERSION" ]; then
            echo "ERROR: No Reddit experimental version detected."
            exit 1
          fi


          echo
          echo "Latest Reddit experimental:"
          echo "$REDDIT_VERSION"


          echo "reddit_version=$REDDIT_VERSION" \
            >> "$GITHUB_OUTPUT"


          echo
          echo "=========================================="
          echo "FINAL VERSION SELECTION"
          echo "=========================================="
          echo "YouTube:"
          echo "$YOUTUBE_VERSIONS" | jq -r '.[]'
          echo
          echo "Reddit:"
          echo "$REDDIT_VERSION"
          echo "=========================================="


  # =========================================================
  # 2. YOUTUBE
  # Stable + Experimental
  # =========================================================
  youtube:
    name: YouTube - ${{ matrix.version }}
    needs: detect
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        version: ${{ fromJSON(needs.detect.outputs.youtube_versions) }}

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # -------------------------------------------------------
      # APKMirror Downloader
      # -------------------------------------------------------
      - name: Install APKMirror Downloader
        shell: bash
        run: |
          set -euo pipefail

          npm install -g "${APKMD_PACKAGE}"

          apkmd --help


      # -------------------------------------------------------
      # Download YouTube ARM64
      # -------------------------------------------------------
      - name: Download YouTube
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads",
              "overwrite": true
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${{ matrix.version }}",
                "arch": "arm64-v8a",
                "type": "apk",
                "outFile": "youtube-${{ matrix.version }}.apk",
                "overwrite": true
              }
            ]
          }
          EOF

          echo "Downloading YouTube:"
          echo "${{ matrix.version }}"
          echo "Architecture: arm64-v8a"

          apkmd apps.json

          echo
          echo "Downloaded files:"
          find downloads -type f -print


      - name: Find YouTube APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find downloads -type f \
              \( -name "*.apk" -o -name "*.apkm" \) |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK/APKM not found."
            exit 1
          fi

          echo "Input:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Patch with latest Morphe DEV
      # -------------------------------------------------------
      - name: Patch YouTube with Morphe DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/result.json" \
            --out "output/YouTube-${{ matrix.version }}-Morphe-DEV-ARM64.apk" \
            "${{ steps.apk.outputs.apk }}"


      - name: Verify YouTube APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/YouTube-${{ matrix.version }}-Morphe-DEV-ARM64.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Patched YouTube APK was not created."
            exit 1
          fi

          echo "SUCCESS:"
          ls -lh "$APK"


      - name: Upload YouTube artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-${{ matrix.version }}-Morphe-DEV-ARM64
          path: |
            output/*.apk
            output/*.json
          if-no-files-found: error


  # =========================================================
  # 3. REDDIT
  # Latest Experimental / Not Recommended
  # =========================================================
  reddit:
    name: Reddit - Latest Experimental
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # -------------------------------------------------------
      # APKMirror Downloader
      # -------------------------------------------------------
      - name: Install APKMirror Downloader
        shell: bash
        run: |
          set -euo pipefail

          npm install -g "${APKMD_PACKAGE}"

          apkmd --help


      # -------------------------------------------------------
      # Download latest Reddit experimental ARM64
      # -------------------------------------------------------
      - name: Download Reddit Experimental
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          REDDIT_VERSION="${{ needs.detect.outputs.reddit_version }}"

          echo "=========================================="
          echo "Reddit Experimental"
          echo "Version: $REDDIT_VERSION"
          echo "Architecture: arm64-v8a"
          echo "=========================================="


          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads",
              "overwrite": true
            },
            "apps": [
              {
                "org": "redditinc",
                "repo": "reddit",
                "version": "${REDDIT_VERSION}",
                "arch": "arm64-v8a",
                "type": "bundle",
                "outFile": "reddit-${REDDIT_VERSION}.apkm",
                "overwrite": true
              }
            ]
          }
          EOF

          apkmd apps.json

          echo
          echo "Downloaded Reddit files:"
          find downloads -type f -print


      - name: Find Reddit APK/APKM
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find downloads -type f \
              \( -name "*.apk" -o -name "*.apkm" \) |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Reddit APK/APKM not found."
            exit 1
          fi

          echo "Input:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Patch Reddit with latest Morphe DEV
      # -------------------------------------------------------
      - name: Patch Reddit with Morphe DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          REDDIT_VERSION="${{ needs.detect.outputs.reddit_version }}"

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/reddit-result.json" \
            --out "output/Reddit-${REDDIT_VERSION}-Morphe-DEV-Experimental-ARM64.apk" \
            "${{ steps.apk.outputs.apk }}"


      - name: Verify Reddit APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-DEV-Experimental-ARM64.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Patched Reddit APK was not created."
            exit 1
          fi

          echo "SUCCESS:"
          ls -lh "$APK"


      - name: Upload Reddit artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-DEV-Experimental-ARM64
          path: |
            output/*.apk
            output/*.json
          if-no-files-found: error


  # =========================================================
  # 4. MICROG-RE
  # =========================================================
  microg:
    name: Latest MicroG-RE ARM64
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Download latest MicroG-RE ARM64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          URL="$(
            curl -fsSL \
              "https://api.github.com/repos/${MICROG_REPO}/releases/latest" |
            jq -r '
              .assets[]
              | select(.name | test("arm64-v8a.*\\.apk$"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: MicroG-RE ARM64 APK not found."
            exit 1
          fi

          echo "Downloading:"
          echo "$URL"

          curl -fL "$URL" \
            -o "output/$(basename "$URL")"

          ls -lh output/


      - name: Upload MicroG-RE
        uses: actions/upload-artifact@v4
        with:
          name: MicroG-RE-ARM64
          path: output/*.apk
          if-no-files-found: error


  # =========================================================
  # 5. COMBINED RELEASE
  # =========================================================
  release:
    name: Create Combined Release

    needs:
      - detect
      - youtube
      - reddit
      - microg

    runs-on: ubuntu-latest

    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true


      - name: Show release files
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL RELEASE FILES"
          echo "=========================================="

          find release-assets \
            -type f \
            -printf '%p\n' |
            sort


      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          # Morphe DEV ARM64 Bundle

          ## Morphe

          DEV patches:
          ${{ needs.detect.outputs.patch_tag }}

          Morphe Desktop DEV:
          ${{ needs.detect.outputs.desktop_tag }}

          MicroG-RE:
          ${{ needs.detect.outputs.microg_tag }}

          ## YouTube

          Includes:
          - Stable-compatible versions
          - Experimental-compatible versions
          - Morphe DEV patches
          - ARM64 only

          ## Reddit

          Includes:
          - Latest experimental / not-recommended compatible version
          - Morphe DEV patches
          - ARM64 only

          ## Architecture

          arm64-v8a

          ## Automatic build

          This workflow runs once every 24 hours.

          Manual:
          Run workflow is also available.

          ## Patch source

          https://github.com/${PATCHES_REPO}

          ## Morphe documentation

          https://github.com/${MORPHE_REPO}
          EOF


      - name: Create Combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "morphe-dev-${{ needs.detect.outputs.patch_tag }}"
          name: "Morphe DEV ${{ needs.detect.outputs.patch_tag }} - ARM64 Bundle"
          body_path: release-notes.md
          prerelease: true
          generate_release_notes: false

          files: |
            release-assets/**/*.apk
            release-assets/**/*.json
