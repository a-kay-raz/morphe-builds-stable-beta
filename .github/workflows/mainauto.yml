name: Auto Morphe DEV - YouTube Stable Experimental Reddit ARM64

on:
  workflow_dispatch:

  schedule:
    # Every 24 hours
    # 18:17 UTC = 23:47 IST
    - cron: "17 18 * * *"

permissions:
  contents: write

env:
  PATCHES_REPO: MorpheApp/morphe-patches
  MORPHE_REPO: MorpheApp/morphe-desktop
  MICROG_REPO: MorpheApp/MicroG-RE
  APKMD_PACKAGE: apkmirror-downloader

  ARCH: arm64-v8a


jobs:

  # =========================================================
  # 1. DETECT + DOWNLOAD MORPHE DEV
  # =========================================================
  detect:
    name: Detect Morphe DEV + Versions
    runs-on: ubuntu-latest

    outputs:
      patch_tag: ${{ steps.detect.outputs.patch_tag }}
      desktop_tag: ${{ steps.detect.outputs.desktop_tag }}
      microg_tag: ${{ steps.detect.outputs.microg_tag }}
      youtube_versions: ${{ steps.versions.outputs.youtube_versions }}

    steps:

      # -------------------------------------------------------
      # Java 21
      # -------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true


      # -------------------------------------------------------
      # FORCE JAVA 21
      # -------------------------------------------------------
      - name: Verify Java 21
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${JAVA_HOME}/bin:${PATH}"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA=$JAVA_HOME/bin/java"

          which java
          java -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            head -n 1 |
            sed -E 's/.*version "([0-9]+).*/\1/'
          )"

          if [ "$JAVA_MAJOR" != "21" ]; then
            echo "ERROR: Java 21 required."
            echo "Detected Java: $JAVA_MAJOR"
            exit 1
          fi


      # -------------------------------------------------------
      # Detect latest Morphe DEV patch + Desktop DEV
      # -------------------------------------------------------
      - name: Detect latest Morphe DEV
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${JAVA_HOME}/bin:${PATH}"

          echo "Detecting latest Morphe DEV patches..."

          PATCH_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${PATCHES_REPO}/releases?per_page=100"
          )"

          PATCH_TAG="$(
            echo "$PATCH_JSON" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.draft == false)
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_TAG" ] || [ "$PATCH_TAG" = "null" ]; then
            echo "ERROR: No Morphe DEV patch release found."
            exit 1
          fi


          echo "Detecting latest Morphe Desktop DEV..."

          DESKTOP_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100"
          )"

          DESKTOP_TAG="$(
            echo "$DESKTOP_JSON" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.draft == false)
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$DESKTOP_TAG" ] || [ "$DESKTOP_TAG" = "null" ]; then
            echo "ERROR: No Morphe Desktop DEV release found."
            exit 1
          fi


          echo "Detecting latest stable MicroG-RE..."

          MICROG_TAG="$(
            curl -fsSL \
              "https://api.github.com/repos/${MICROG_REPO}/releases/latest" |
            jq -r '.tag_name'
          )"


          echo "patch_tag=$PATCH_TAG" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=$DESKTOP_TAG" >> "$GITHUB_OUTPUT"
          echo "microg_tag=$MICROG_TAG" >> "$GITHUB_OUTPUT"


          echo
          echo "=========================================="
          echo "Morphe DEV patches : $PATCH_TAG"
          echo "Morphe Desktop DEV  : $DESKTOP_TAG"
          echo "MicroG-RE           : $MICROG_TAG"
          echo "=========================================="


      # -------------------------------------------------------
      # Download Morphe Desktop DEV
      # -------------------------------------------------------
      - name: Download Morphe Desktop DEV
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${JAVA_HOME}/bin:${PATH}"

          mkdir -p tools

          DESKTOP_TAG="${{ steps.detect.outputs.desktop_tag }}"

          echo "Downloading Morphe Desktop:"
          echo "$DESKTOP_TAG"

          RELEASE_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/tags/${DESKTOP_TAG}"
          )"

          JAR_URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$JAR_URL" ] || [ "$JAR_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop -all.jar not found."

            echo "Available assets:"
            echo "$RELEASE_JSON" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "JAR:"
          echo "$JAR_URL"

          curl -fL "$JAR_URL" \
            -o tools/morphe-desktop.jar

          test -s tools/morphe-desktop.jar

          echo
          echo "Downloaded:"
          ls -lh tools/morphe-desktop.jar

          echo
          echo "Testing Morphe:"
          java -jar tools/morphe-desktop.jar --version


      # -------------------------------------------------------
      # Upload Morphe JAR so other jobs can use it
      # -------------------------------------------------------
      - name: Upload Morphe Desktop
        uses: actions/upload-artifact@v4
        with:
          name: morphe-desktop-jar
          path: tools/morphe-desktop.jar
          if-no-files-found: error


      # -------------------------------------------------------
      # Detect YouTube stable + experimental versions
      # -------------------------------------------------------
      - name: Detect YouTube versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${JAVA_HOME}/bin:${PATH}"

          PATCH_SOURCE="https://github.com/${PATCHES_REPO}"

          echo
          echo "=========================================="
          echo "YouTube compatible versions"
          echo "Stable + Experimental"
          echo "=========================================="

          YT_OUTPUT="$(
            java -jar tools/morphe-desktop.jar list-versions \
              --patches "$PATCH_SOURCE" \
              --prerelease \
              --include-experimental \
              --filter-package-names com.google.android.youtube
          )"

          echo "$YT_OUTPUT"


          YOUTUBE_VERSIONS="$(
            printf '%s\n' "$YT_OUTPUT" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
            sort -Vu |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
              | unique
            '
          )"


          if [ "$YOUTUBE_VERSIONS" = "[]" ]; then
            echo "ERROR: No YouTube versions detected."
            exit 1
          fi


          echo
          echo "Detected YouTube versions:"
          echo "$YOUTUBE_VERSIONS" | jq -r '.[]'

          echo "youtube_versions=$YOUTUBE_VERSIONS" \
            >> "$GITHUB_OUTPUT"


  # =========================================================
  # 2. YOUTUBE
  # ALL STABLE + EXPERIMENTAL COMPATIBLE VERSIONS
  # =========================================================
  youtube:
    name: YouTube - ${{ matrix.version }}
    needs: detect
    runs-on: ubuntu-latest

    # One failed version must NOT stop other versions.
    continue-on-error: true

    strategy:
      fail-fast: false

      matrix:
        version: ${{ fromJSON(needs.detect.outputs.youtube_versions) }}

    steps:

      # -------------------------------------------------------
      # Java 21
      # -------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true


      - name: Verify Java 21
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${JAVA_HOME}/bin:${PATH}"

          java -version


      # -------------------------------------------------------
      # Node 22
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      # -------------------------------------------------------
      # Download Morphe JAR from detect job
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        uses: actions/download-artifact@v4
        with:
          name: morphe-desktop-jar
          path: tools


      - name: Verify Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${JAVA_HOME}/bin:${PATH}"

          test -s tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version


      # -------------------------------------------------------
      # Install APKMirror Downloader
      # -------------------------------------------------------
      - name: Install APKMirror Downloader
        shell: bash
        run: |
          set -euo pipefail

          npm install -g "${APKMD_PACKAGE}"

          apkmd --help


      # -------------------------------------------------------
      # Download YouTube
      # -------------------------------------------------------
      - name: Download YouTube
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          VERSION="${{ matrix.version }}"

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads",
              "overwrite": true
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${VERSION}",
                "arch": "arm64-v8a",
                "type": "apk",
                "outFile": "youtube-${VERSION}.apk",
                "overwrite": true
              }
            ]
          }
          EOF

          echo "Downloading YouTube ${VERSION}"
          echo "Architecture: arm64-v8a"

          apkmd apps.json

          echo
          echo "Downloaded files:"
          find downloads -type f -print


      - name: Find YouTube APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find downloads -type f \
              -name "*.apk" -o -name "*.apkm" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK/APKM not found."
            exit 1
          fi

          echo "Input:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Patch YouTube with latest Morphe DEV
      # -------------------------------------------------------
      - name: Patch YouTube with Morphe DEV
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${JAVA_HOME}/bin:${PATH}"

          mkdir -p output

          VERSION="${{ matrix.version }}"

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/result.json" \
            --out "output/YouTube-${VERSION}-Morphe-DEV-ARM64.apk" \
            "${{ steps.apk.outputs.apk }}"


      - name: Verify YouTube APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/YouTube-${{ matrix.version }}-Morphe-DEV-ARM64.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Patched APK not created."
            exit 1
          fi

          ls -lh "$APK"


      - name: Upload YouTube
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-${{ matrix.version }}-Morphe-DEV-ARM64
          path: |
            output/*.apk
            output/*.json
          if-no-files-found: error


  # =========================================================
  # 3. REDDIT
  # LATEST VERSION - NOT RECOMMENDED / EXPERIMENTAL
  # =========================================================
  reddit:
    name: Reddit - Latest Not Recommended
    needs: detect
    runs-on: ubuntu-latest

    # Reddit failure should not block MicroG/release.
    continue-on-error: true

    steps:

      # -------------------------------------------------------
      # Java 21
      # -------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          check-latest: true


      - name: Verify Java 21
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${JAVA_HOME}/bin:${PATH}"

          java -version


      # -------------------------------------------------------
      # Node 22
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      # -------------------------------------------------------
      # Download Morphe JAR
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        uses: actions/download-artifact@v4
        with:
          name: morphe-desktop
