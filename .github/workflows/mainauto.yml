name: Auto Morphe Dev - YouTube Stable Experimental Reddit ARM64

on:
  workflow_dispatch:

  schedule:
    # Run once every 24 hours
    # 18:17 UTC = 23:47 IST
    - cron: "17 18 * * *"

permissions:
  contents: write

env:
  PATCHES_REPO: MorpheApp/morphe-patches
  MORPHE_REPO: MorpheApp/morphe-desktop
  MICROG_REPO: MorpheApp/MicroG-RE
  APKMD_REPO: tanishqmanuja/apkmirror-downloader

  # ARM64 only
  ARCH: arm64-v8a


jobs:

  # =========================================================
  # 1. Detect latest Morphe Dev + supported versions
  # =========================================================
  detect:
    name: Detect Latest Morphe Dev
    runs-on: ubuntu-latest

    outputs:
      patch_tag: ${{ steps.detect.outputs.patch_tag }}
      patch_version: ${{ steps.detect.outputs.patch_version }}
      desktop_tag: ${{ steps.detect.outputs.desktop_tag }}
      microg_tag: ${{ steps.detect.outputs.microg_tag }}
      reddit_version: ${{ steps.versions.outputs.reddit_version }}
      youtube_versions: ${{ steps.versions.outputs.youtube_versions }}

    steps:

      - name: Detect latest releases
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking latest Morphe Dev patch release..."

          PATCH_JSON="$(curl -fsSL \
            "https://api.github.com/repos/${PATCHES_REPO}/releases?per_page=100")"

          PATCH_TAG="$(
            echo "$PATCH_JSON" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.draft == false)
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_TAG" ] || [ "$PATCH_TAG" = "null" ]; then
            echo "ERROR: No Morphe Dev pre-release found."
            exit 1
          fi

          PATCH_VERSION="${PATCH_TAG#v}"

          DESKTOP_TAG="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/latest" |
            jq -r '.tag_name'
          )"

          MICROG_TAG="$(
            curl -fsSL \
              "https://api.github.com/repos/${MICROG_REPO}/releases/latest" |
            jq -r '.tag_name'
          )"

          echo "patch_tag=$PATCH_TAG" >> "$GITHUB_OUTPUT"
          echo "patch_version=$PATCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=$DESKTOP_TAG" >> "$GITHUB_OUTPUT"
          echo "microg_tag=$MICROG_TAG" >> "$GITHUB_OUTPUT"

          echo
          echo "======================================"
          echo "Morphe Dev    : $PATCH_TAG"
          echo "Morphe Desktop : $DESKTOP_TAG"
          echo "MicroG-RE      : $MICROG_TAG"
          echo "======================================"


      # -------------------------------------------------------
      # Read supported YouTube + Reddit versions
      # -------------------------------------------------------
      - name: Read supported versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading Morphe patch metadata..."

          curl -fsSL \
            "https://raw.githubusercontent.com/${PATCHES_REPO}/main/patches-list.json" \
            -o patches-list.json

          echo
          echo "Detecting YouTube versions..."

          # All YouTube versions currently present in Morphe metadata
          # including stable + experimental.
          YOUTUBE_VERSIONS="$(
            jq -c '
              [
                .patches[]
                .compatiblePackages[]?
                | select(.packageName == "com.google.android.youtube")
                | .targets[]?
                | .version
              ]
              | unique
            ' patches-list.json
          )"

          if [ "$YOUTUBE_VERSIONS" = "[]" ]; then
            echo "ERROR: No YouTube versions found."
            exit 1
          fi

          echo "YouTube versions:"
          echo "$YOUTUBE_VERSIONS" | jq -r '.[]'


          echo
          echo "Detecting latest Reddit experimental version..."

          # IMPORTANT:
          # Only Reddit experimental targets are selected.
          REDDIT_VERSION="$(
            jq -r '
              [
                .patches[]
                .compatiblePackages[]?
                | select(.packageName == "com.reddit.frontpage")
                | .targets[]?
                | select(.isExperimental == true)
                | .version
              ]
              | unique
              | .[]
            ' patches-list.json |
            sort -V |
            tail -n 1
          )"

          if [ -z "$REDDIT_VERSION" ]; then
            echo "ERROR: No Reddit experimental version found."
            exit 1
          fi

          echo
          echo "======================================"
          echo "YouTube versions:"
          echo "$YOUTUBE_VERSIONS" | jq -r '.[]'
          echo
          echo "Latest Reddit experimental:"
          echo "$REDDIT_VERSION"
          echo "======================================"

          echo "youtube_versions=$YOUTUBE_VERSIONS" >> "$GITHUB_OUTPUT"
          echo "reddit_version=$REDDIT_VERSION" >> "$GITHUB_OUTPUT"


  # =========================================================
  # 2. YouTube - Stable + Experimental
  # =========================================================
  youtube:
    name: YouTube - ${{ matrix.version }}
    needs: detect
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        version: ${{ fromJSON(needs.detect.outputs.youtube_versions) }}

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # -------------------------------------------------------
      # Download APKMirror Downloader
      # -------------------------------------------------------
      - name: Download APKMirror Downloader
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          RELEASE_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${APKMD_REPO}/releases/latest"
          )"

          ASSET_URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(
                  .name
                  | test("linux|Linux")
                )
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: APKMirror Downloader Linux asset not found."
            exit 1
          fi

          echo "Downloading APKMirror Downloader..."

          curl -fL "$ASSET_URL" \
            -o tools/apkmirror-downloader

          chmod +x tools/apkmirror-downloader

          ./tools/apkmirror-downloader --help || true


      # -------------------------------------------------------
      # Download YouTube ARM64
      # -------------------------------------------------------
      - name: Download YouTube
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${{ matrix.version }}",
                "arch": "arm64-v8a",
                "type": "apk",
                "outFile": "youtube-${{ matrix.version }}.apk",
                "overwrite": true
              }
            ]
          }
          EOF

          echo "Downloading YouTube ${{ matrix.version }} ARM64..."

          ./tools/apkmirror-downloader apps.json

          echo
          echo "Downloaded files:"
          find downloads -type f -print


      - name: Find YouTube APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find downloads -type f \
              \( -name "*.apk" -o -name "*.apkm" \) |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK was not downloaded."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Download latest Morphe Desktop
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          RELEASE_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/latest"
          )"

          JAR_URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$JAR_URL" ] || [ "$JAR_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."
            exit 1
          fi

          curl -fL "$JAR_URL" \
            -o tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version


      # -------------------------------------------------------
      # Patch YouTube with latest Morphe DEV
      # -------------------------------------------------------
      - name: Patch YouTube with Morphe DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          echo "Patching YouTube ${{ matrix.version }}..."

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/result.json" \
            -o "output/YouTube-${{ matrix.version }}-Morphe-Dev-ARM64.apk" \
            "${{ steps.apk.outputs.apk }}"


      - name: Verify YouTube output
        shell: bash
        run: |
          set -euo pipefail

          APK="output/YouTube-${{ matrix.version }}-Morphe-Dev-ARM64.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Patched YouTube APK not created."
            exit 1
          fi

          echo "SUCCESS:"
          ls -lh "$APK"


      - name: Upload YouTube artifact
        uses: actions/upload-artifact@v6
        with:
          name: YouTube-${{ matrix.version }}-Morphe-Dev-ARM64
          path: |
            output/*.apk
            output/result.json
          if-no-files-found: error


  # =========================================================
  # 3. Reddit - Latest Experimental
  # =========================================================
  reddit:
    name: Reddit - Latest Experimental
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # -------------------------------------------------------
      # Same APKMirror Downloader method as YouTube
      # -------------------------------------------------------
      - name: Download APKMirror Downloader
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          RELEASE_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${APKMD_REPO}/releases/latest"
          )"

          ASSET_URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(
                  .name
                  | test("linux|Linux")
                )
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: APKMirror Downloader Linux asset not found."
            exit 1
          fi

          curl -fL "$ASSET_URL" \
            -o tools/apkmirror-downloader

          chmod +x tools/apkmirror-downloader


      # -------------------------------------------------------
      # Download Reddit latest EXPERIMENTAL ARM64
      # -------------------------------------------------------
      - name: Download Reddit Experimental
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          REDDIT_VERSION="${{ needs.detect.outputs.reddit_version }}"

          echo "======================================"
          echo "Reddit Experimental"
          echo "Version: $REDDIT_VERSION"
          echo "Architecture: arm64-v8a"
          echo "======================================"

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "reddit-inc",
                "repo": "reddit",
                "version": "${REDDIT_VERSION}",
                "arch": "arm64-v8a",
                "type": "bundle",
                "outFile": "reddit-${REDDIT_VERSION}.apkm",
                "overwrite": true
              }
            ]
          }
          EOF

          ./tools/apkmirror-downloader apps.json

          echo
          echo "Downloaded Reddit files:"
          find downloads -type f -print


      - name: Find Reddit APK/APKM
        id: reddit_apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find downloads -type f \
              \( -name "*.apk" -o -name "*.apkm" \) |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Reddit APK/APKM was not downloaded."
            exit 1
          fi

          echo "Reddit input:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Download Morphe Desktop
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          RELEASE_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/latest"
          )"

          JAR_URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$JAR_URL" ] || [ "$JAR_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."
            exit 1
          fi

          curl -fL "$JAR_URL" \
            -o tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version


      # -------------------------------------------------------
      # PATCH REDDIT WITH MORPHE DEV + EXPERIMENTAL PATCHES
      # -------------------------------------------------------
      - name: Patch Reddit Experimental with Morphe DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          REDDIT_VERSION="${{ needs.detect.outputs.reddit_version }}"

          echo "======================================"
          echo "Patching Reddit"
          echo "Version: $REDDIT_VERSION"
          echo "Morphe channel: DEV / PRE-RELEASE"
          echo "Architecture: ARM64"
          echo "======================================"

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/reddit-result.json" \
            -o "output/Reddit-${REDDIT_VERSION}-Morphe-Dev-Experimental-ARM64.apk" \
            "${{ steps.reddit_apk.outputs.apk }}"


      - name: Verify Reddit output
        shell: bash
        run: |
          set -euo pipefail

          REDDIT_APK="output/Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-Dev-Experimental-ARM64.apk"

          if [ ! -s "$REDDIT_APK" ]; then
            echo "ERROR: Reddit patched APK was not created."
            exit 1
          fi

          echo "SUCCESS:"
          ls -lh "$REDDIT_APK"


      - name: Upload Reddit artifact
        uses: actions/upload-artifact@v6
        with:
          name: Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-Dev-Experimental-ARM64
          path: |
            output/*.apk
            output/*.json
          if-no-files-found: error


  # =========================================================
  # 4. Latest stable MicroG-RE ARM64
  # =========================================================
  microg:
    name: Latest MicroG-RE ARM64
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Download latest MicroG-RE ARM64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          RELEASE_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${MICROG_REPO}/releases/latest"
          )"

          URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(.name | test("arm64-v8a\\.apk$"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: Latest stable MicroG-RE ARM64 APK not found."
            exit 1
          fi

          NAME="$(basename "$URL")"

          curl -fL "$URL" \
            -o "output/$NAME"

          echo
          echo "MicroG-RE:"
          ls -lh output/


      - name: Upload MicroG-RE
        uses: actions/upload-artifact@v6
        with:
          name: MicroG-RE-ARM64
          path: output/*.apk
          if-no-files-found: error


  # =========================================================
  # 5. Combined GitHub Release
  # =========================================================
  release:
    name: Create Combined Release

    needs:
      - detect
      - youtube
      - reddit
      - microg

    runs-on: ubuntu-latest

    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true


      - name: Show release files
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL RELEASE FILES"
          echo "======================================"

          find release-assets \
            -type f \
            -printf '%p\n' |
            sort


      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          # Morphe Dev ARM64 Bundle

          **Morphe Dev Patches:** ${{ needs.detect.outputs.patch_tag }}

          **Morphe Desktop:** ${{ needs.detect.outputs.desktop_tag }}

          **MicroG-RE:** ${{ needs.detect.outputs.microg_tag }}

          ---

          ## Included

          ### YouTube
          - Stable versions supported by current Morphe patches
          - Experimental versions supported by current Morphe patches
          - ARM64 only

          ### Reddit
          - Latest Reddit experimental-compatible version
          - Morphe Dev / Pre-release patches
          - ARM64 only

          ### MicroG-RE
          - Latest stable ARM64 release

          ---

          ## Build architecture

          \`arm64-v8a\`

          ---

          ## Automatic build

          This workflow runs automatically once every 24 hours.

          It can also be started manually using **Run workflow**.

          ---

          ## Patch source

          https://github.com/${PATCHES_REPO}

          ## Notes

          YouTube and Reddit versions are detected from the current
          Morphe patch compatibility metadata.

          Reddit is specifically selected from the experimental targets.

          Morphe Dev pre-release patches are used for all patched apps.
          EOF


      # -------------------------------------------------------
      # Create combined prerelease
      # -------------------------------------------------------
      - name: Create Combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "morphe-dev-${{ needs.detect.outputs.patch_tag }}"
          name: "Morphe Dev ${{ needs.detect.outputs.patch_tag }} - ARM64 Bundle"
          body_path: release-notes.md

          # Morphe Dev = prerelease
          prerelease: true

          generate_release_notes: false

          files: |
            release-assets/**/*.apk
            release-assets/**/*.json
