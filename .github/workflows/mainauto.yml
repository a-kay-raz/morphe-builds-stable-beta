name: Auto Morphe DEV - YouTube Stable Experimental Reddit ARM64

on:
  workflow_dispatch:

  schedule:
    # Every 24 hours
    # 18:17 UTC = 23:47 IST
    - cron: "17 18 * * *"

permissions:
  contents: write

env:
  PATCHES_REPO: MorpheApp/morphe-patches
  MORPHE_REPO: MorpheApp/morphe-desktop
  MICROG_REPO: MorpheApp/MicroG-RE
  APKMD_PACKAGE: apkmirror-downloader

  ARCH: arm64-v8a


jobs:

  # =========================================================
  # DETECT MORPHE DEV + APP VERSIONS
  # =========================================================
  detect:
    name: Detect Morphe DEV + Versions
    runs-on: ubuntu-latest

    outputs:
      patch_tag: ${{ steps.info.outputs.patch_tag }}
      desktop_tag: ${{ steps.info.outputs.desktop_tag }}
      microg_tag: ${{ steps.info.outputs.microg_tag }}
      youtube_versions: ${{ steps.versions.outputs.youtube_versions }}
      reddit_version: ${{ steps.versions.outputs.reddit_version }}

    steps:

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # -------------------------------------------------------
      # Latest Morphe DEV patch release
      # -------------------------------------------------------
      - name: Detect latest Morphe DEV
        id: info
        shell: bash
        run: |
          set -euo pipefail

          PATCH_JSON="$(
            curl -fsSL \
              "https://api.github.com/repos/${PATCHES_REPO}/releases?per_page=100"
          )"

          PATCH_TAG="$(
            echo "$PATCH_JSON" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.draft == false)
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_TAG" ] || [ "$PATCH_TAG" = "null" ]; then
            echo "ERROR: No Morphe DEV patch release found."
            exit 1
          fi

          DESKTOP_TAG="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.draft == false)
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          MICROG_TAG="$(
            curl -fsSL \
              "https://api.github.com/repos/${MICROG_REPO}/releases/latest" |
            jq -r '.tag_name'
          )"

          echo "patch_tag=$PATCH_TAG" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=$DESKTOP_TAG" >> "$GITHUB_OUTPUT"
          echo "microg_tag=$MICROG_TAG" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Morphe DEV    : $PATCH_TAG"
          echo "Morphe Desktop : $DESKTOP_TAG"
          echo "MicroG-RE      : $MICROG_TAG"
          echo "======================================"


      # -------------------------------------------------------
      # Download latest Morphe Desktop DEV
      # -------------------------------------------------------
      - name: Download Morphe Desktop DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          JAR_URL="$(
            curl -fsSL \
              "https://api.github.com/repos/${MORPHE_REPO}/releases/${{ steps.info.outputs.desktop_tag }}" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$JAR_URL" ] || [ "$JAR_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop DEV JAR not found."
            exit 1
          fi

          curl -fL "$JAR_URL" \
            -o tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version


      # -------------------------------------------------------
      # Get YouTube STABLE + EXPERIMENTAL versions
      # directly from the DEV patch bundle
      # -------------------------------------------------------
      - name: Detect YouTube versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Detecting YouTube versions from Morphe DEV..."

          YT_OUTPUT="$(
            java -jar tools/morphe-desktop.jar list-versions \
              --patches "https://github.com/${PATCHES_REPO}" \
              --prerelease \
              --include-experimental \
              --filter-package-names com.google.android.youtube
          )"

          echo "========== MORPHE YOUTUBE =========="
          echo "$YT_OUTPUT"
          echo "===================================="

          YOUTUBE_VERSIONS="$(
            echo "$YT_OUTPUT" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
            sort -Vu |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
              | unique
            '
          )"

          if [ "$YOUTUBE_VERSIONS" = "[]" ]; then
            echo "ERROR: No YouTube versions detected."
            exit 1
          fi

          echo
          echo "YouTube versions:"
          echo "$YOUTUBE_VERSIONS" | jq -r '.[]'

          echo "youtube_versions=$YOUTUBE_VERSIONS" >> "$GITHUB_OUTPUT"


          # ---------------------------------------------------
          # Reddit:
          # latest version from experimental-capable DEV list
          # ---------------------------------------------------
          echo
          echo "Detecting Reddit experimental versions..."

          REDDIT_OUTPUT="$(
            java -jar tools/morphe-desktop.jar list-versions \
              --patches "https://github.com/${PATCHES_REPO}" \
              --prerelease \
              --include-experimental \
              --filter-package-names com.reddit.frontpage
          )"

          echo "========== MORPHE REDDIT =========="
          echo "$REDDIT_OUTPUT"
          echo "==================================="

          REDDIT_VERSION="$(
            echo "$REDDIT_OUTPUT" |
            grep -oE '[0-9]{4}\.[0-9]+\.[0-9]+' |
            sort -V |
            tail -n 1
          )"

          if [ -z "$REDDIT_VERSION" ]; then
            echo "ERROR: No Reddit version detected."
            exit 1
          fi

          echo
          echo "Latest Reddit version:"
          echo "$REDDIT_VERSION"

          echo "reddit_version=$REDDIT_VERSION" >> "$GITHUB_OUTPUT"


  # =========================================================
  # YOUTUBE
  # Stable + Experimental
  # =========================================================
  youtube:
    name: YouTube - ${{ matrix.version }}
    needs: detect

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        version: ${{ fromJSON(needs.detect.outputs.youtube_versions) }}

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # -------------------------------------------------------
      # APKMirror Downloader
      # -------------------------------------------------------
      - name: Install APKMirror Downloader
        shell: bash
        run: |
          set -euo pipefail

          npm install -g "${APKMD_PACKAGE}"

          apkmd --help


      # -------------------------------------------------------
      # Download YouTube ARM64
      # -------------------------------------------------------
      - name: Download YouTube ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads",
              "overwrite": true
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${{ matrix.version }}",
                "arch": "arm64-v8a",
                "type": "apk",
                "outFile": "youtube-${{ matrix.version }}.apk",
                "overwrite": true
              }
            ]
          }
          EOF

          apkmd apps.json

          echo "Downloaded:"
          find downloads -type f -print


      - name: Find YouTube APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find downloads -type f \
              \( -name "*.apk" -o -name "*.apkm" \) |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK not found."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Patch using MORPHE DEV
      # -------------------------------------------------------
      - name: Patch YouTube with Morphe DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/result.json" \
            --out "output/YouTube-${{ matrix.version }}-Morphe-DEV-ARM64.apk" \
            "${{ steps.apk.outputs.apk }}"


      - name: Verify YouTube APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/YouTube-${{ matrix.version }}-Morphe-DEV-ARM64.apk"

          test -s "$APK"

          echo "SUCCESS:"
          ls -lh "$APK"


      - name: Upload YouTube
        uses: actions/upload-artifact@v6
        with:
          name: YouTube-${{ matrix.version }}-Morphe-DEV-ARM64
          path: |
            output/*.apk
            output/*.json
          if-no-files-found: error


  # =========================================================
  # REDDIT
  # Latest Experimental / Not Recommended
  # =========================================================
  reddit:
    name: Reddit - Latest Experimental
    needs: detect

    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      - name: Install APKMirror Downloader
        shell: bash
        run: |
          set -euo pipefail

          npm install -g "${APKMD_PACKAGE}"

          apkmd --help


      # -------------------------------------------------------
      # Reddit latest experimental
      # IMPORTANT: redditinc/reddit
      # -------------------------------------------------------
      - name: Download Reddit Experimental
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          REDDIT_VERSION="${{ needs.detect.outputs.reddit_version }}"

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads",
              "overwrite": true
            },
            "apps": [
              {
                "org": "redditinc",
                "repo": "reddit",
                "version": "${REDDIT_VERSION}",
                "arch": "arm64-v8a",
                "type": "bundle",
                "outFile": "reddit-${REDDIT_VERSION}.apkm",
                "overwrite": true
              }
            ]
          }
          EOF

          echo "Downloading Reddit ${REDDIT_VERSION}..."

          apkmd apps.json

          echo "Downloaded:"
          find downloads -type f -print


      - name: Find Reddit APK/APKM
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find downloads -type f \
              \( -name "*.apk" -o -name "*.apkm" \) |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Reddit APK/APKM not found."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Patch Reddit using MORPHE DEV
      # -------------------------------------------------------
      - name: Patch Reddit with Morphe DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          REDDIT_VERSION="${{ needs.detect.outputs.reddit_version }}"

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/reddit-result.json" \
            --out "output/Reddit-${REDDIT_VERSION}-Morphe-DEV-Experimental-ARM64.apk" \
            "${{ steps.apk.outputs.apk }}"


      - name: Verify Reddit APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-DEV-Experimental-ARM64.apk"

          test -s "$APK"

          echo "SUCCESS:"
          ls -lh "$APK"


      - name: Upload Reddit
        uses: actions/upload-artifact@v6
        with:
          name: Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-DEV-Experimental-ARM64
          path: |
            output/*.apk
            output/*.json
          if-no-files-found: error


  # =========================================================
  # MICROG-RE
  # =========================================================
  microg:
    name: Latest MicroG-RE ARM64
    needs: detect

    runs-on: ubuntu-latest

    steps:

      - name: Download latest MicroG-RE ARM64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          URL="$(
            curl -fsSL \
              "https://api.github.com/repos/${MICROG_REPO}/releases/latest" |
            jq -r '
              .assets[]
              | select(.name | test("arm64-v8a.*\\.apk$"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "ERROR: MicroG-RE ARM64 APK not found."
            exit 1
          fi

          curl -fL "$URL" \
            -o "output/$(basename "$URL")"

          ls -lh output/


      - name: Upload MicroG
        uses: actions/upload-artifact@v6
        with:
          name: MicroG-RE-ARM64
          path: output/*.apk
          if-no-files-found: error


  # =========================================================
  # COMBINED RELEASE
  # =========================================================
  release:
    name: Create Combined Release

    needs:
      - detect
      - youtube
      - reddit
      - microg

    runs-on: ubuntu-latest

    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true


      - name: Show release files
        shell: bash
        run: |
          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          find release-assets \
            -type f \
            -printf '%p\n' |
            sort


      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          # Morphe DEV ARM64 Bundle

          Morphe DEV patches:
          ${{ needs.detect.outputs.patch_tag }}

          Morphe Desktop:
          ${{ needs.detect.outputs.desktop_tag }}

          MicroG-RE:
          ${{ needs.detect.outputs.microg_tag }}

          ## Included

          ### YouTube
          - Stable compatible versions
          - Experimental compatible versions
          - ARM64 only
          - Morphe DEV patches

          ### Reddit
          - Latest experimental / not-recommended version
          - Morphe DEV patches
          - ARM64 only

          ### MicroG-RE
          - Latest stable ARM64 release

          ## Architecture

          arm64-v8a

          ## Schedule

          Automatic build every 24 hours.

          Manual build is also available.

          ## Official Morphe patches

          https://github.com/${PATCHES_REPO}
          EOF


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "morphe-dev-${{ needs.detect.outputs.patch_tag }}"
          name: "Morphe DEV ${{ needs.detect.outputs.patch_tag }} - ARM64"
          body_path: release-notes.md
          prerelease: true
          generate_release_notes: false

          files: |
            release-assets/**/*.apk
            release-assets/**/*.json
