name: Auto Morphe Dev - YouTube Stable Experimental Reddit ARM64

on:
  workflow_dispatch:

  schedule:
    # Check every 6 hours for a new Morphe dev patch release
    - cron: "17 */6 * * *"

permissions:
  contents: write

env:
  PATCHES_REPO: MorpheApp/morphe-patches
  MORPHE_REPO: MorpheApp/morphe-desktop
  MICROG_REPO: MorpheApp/MicroG-RE
  APKMD_REPO: tanishqmanuja/apkmirror-downloader

  # ARM64 only
  ARCH: arm64-v8a

jobs:

  # ---------------------------------------------------------
  # 1. Detect latest Morphe DEV patch release
  # ---------------------------------------------------------
  detect:
    name: Detect Latest Morphe Dev
    runs-on: ubuntu-latest

    outputs:
      patch_tag: ${{ steps.detect.outputs.patch_tag }}
      patch_version: ${{ steps.detect.outputs.patch_version }}
      desktop_tag: ${{ steps.detect.outputs.desktop_tag }}
      microg_tag: ${{ steps.detect.outputs.microg_tag }}
      reddit_version: ${{ steps.versions.outputs.reddit_version }}
      youtube_versions: ${{ steps.versions.outputs.youtube_versions }}

    steps:
      - name: Detect latest releases
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          PATCH_JSON="$(curl -fsSL \
            "https://api.github.com/repos/${PATCHES_REPO}/releases?per_page=100")"

          PATCH_TAG="$(echo "$PATCH_JSON" |
            jq -r '[.[] | select(.prerelease == true)] |
            sort_by(.published_at) | last.tag_name')"

          if [ -z "$PATCH_TAG" ] || [ "$PATCH_TAG" = "null" ]; then
            echo "No Morphe dev prerelease found."
            exit 1
          fi

          PATCH_VERSION="${PATCH_TAG#v}"

          DESKTOP_TAG="$(curl -fsSL \
            "https://api.github.com/repos/${MORPHE_REPO}/releases/latest" |
            jq -r '.tag_name')"

          MICROG_TAG="$(curl -fsSL \
            "https://api.github.com/repos/${MICROG_REPO}/releases/latest" |
            jq -r '.tag_name')"

          echo "patch_tag=$PATCH_TAG" >> "$GITHUB_OUTPUT"
          echo "patch_version=$PATCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=$DESKTOP_TAG" >> "$GITHUB_OUTPUT"
          echo "microg_tag=$MICROG_TAG" >> "$GITHUB_OUTPUT"

          echo "Morphe patches : $PATCH_TAG"
          echo "Morphe Desktop  : $DESKTOP_TAG"
          echo "MicroG-RE       : $MICROG_TAG"

      # -------------------------------------------------------
      # Read versions directly from the Morphe patches metadata
      # -------------------------------------------------------
      - name: Read supported versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/${PATCHES_REPO}/main/patches-list.json" \
            -o patches-list.json

          # YouTube:
          # keep BOTH stable and experimental targets
          jq -r '
            [
              .patches[].compatiblePackages[]?
              | select(.packageName == "com.google.android.youtube")
              | .targets[]?
              | .version
            ]
            | unique
            | .[]
          ' patches-list.json > youtube_versions.txt

          # Reddit:
          # select latest available experimental target
          jq -r '
            [
              .patches[].compatiblePackages[]?
              | select(.packageName == "com.reddit.frontpage")
              | .targets[]?
              | select(.isExperimental == true)
              | .version
            ]
            | unique
            | .[]
          ' patches-list.json |
          sort -V |
          tail -n 1 > reddit_version.txt

          REDDIT_VERSION="$(cat reddit_version.txt)"

          if [ -z "$REDDIT_VERSION" ]; then
            echo "No Reddit experimental target found."
            exit 1
          fi

          YT_VERSIONS="$(paste -sd, youtube_versions.txt)"

          if [ -z "$YT_VERSIONS" ]; then
            echo "No YouTube versions found."
            exit 1
          fi

          echo "youtube_versions=$YT_VERSIONS" >> "$GITHUB_OUTPUT"
          echo "reddit_version=$REDDIT_VERSION" >> "$GITHUB_OUTPUT"

          echo "YouTube versions:"
          cat youtube_versions.txt

          echo
          echo "Reddit latest experimental:"
          echo "$REDDIT_VERSION"


  # ---------------------------------------------------------
  # 2. YouTube builds
  # ---------------------------------------------------------
  youtube:
    name: YouTube - ${{ matrix.version }}
    needs: detect
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(format('[{0}]', needs.detect.outputs.youtube_versions)) }}

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download APKMirror Downloader
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(curl -fsSL \
            "https://api.github.com/repos/${APKMD_REPO}/releases/latest")"

          ASSET_URL="$(echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(.name | test("linux|Linux"))
              | .browser_download_url
            ' |
            head -n 1)"

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "APKMirror Downloader Linux asset not found."
            exit 1
          fi

          mkdir -p tools

          curl -fL "$ASSET_URL" \
            -o tools/apkmirror-downloader

          chmod +x tools/apkmirror-downloader

      - name: Download YouTube
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${{ matrix.version }}",
                "arch": "arm64-v8a",
                "type": "apk",
                "outFile": "youtube-${{ matrix.version }}.apk",
                "overwrite": true
              }
            ]
          }
          EOF

          ./tools/apkmirror-downloader apps.json

          echo "Downloaded files:"
          find downloads -type f -maxdepth 2 -print

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find downloads -type f \
            \( -name "*.apk" -o -name "*.apkm" \) |
            head -n 1)"

          if [ -z "$APK" ]; then
            echo "YouTube APK was not downloaded."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          RELEASE_JSON="$(curl -fsSL \
            "https://api.github.com/repos/${MORPHE_REPO}/releases/latest")"

          JAR_URL="$(echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(.name | endswith("-all.jar"))
              | .browser_download_url
            ' |
            head -n 1)"

          if [ -z "$JAR_URL" ] || [ "$JAR_URL" = "null" ]; then
            echo "Morphe Desktop JAR not found."
            exit 1
          fi

          curl -fL "$JAR_URL" \
            -o tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version

      - name: Patch YouTube with Morphe DEV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/result.json" \
            -o "output/YouTube-${{ matrix.version }}-Morphe-Dev-ARM64.apk" \
            "${{ steps.apk.outputs.apk }}"

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "output/YouTube-${{ matrix.version }}-Morphe-Dev-ARM64.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: YouTube-${{ matrix.version }}-Morphe-Dev-ARM64
          path: |
            output/*.apk
            output/result.json
          if-no-files-found: error


  # ---------------------------------------------------------
  # 3. Reddit latest experimental target
  # ---------------------------------------------------------
  reddit:
    name: Reddit - Latest Experimental
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install APKMirror Downloader
        shell: bash
        run: |
          npm install -g apkmirror-downloader

      - name: Download Reddit
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "reddit-inc",
                "repo": "reddit",
                "version": "${{ needs.detect.outputs.reddit_version }}",
                "arch": "arm64-v8a",
                "type": "bundle",
                "outFile": "reddit-${{ needs.detect.outputs.reddit_version }}.apkm",
                "overwrite": true
              }
            ]
          }
          EOF

          apkmd apps.json

      - name: Find Reddit bundle
        id: reddit_apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find downloads -type f \
            \( -name "*.apk" -o -name "*.apkm" \) |
            head -n 1)"

          if [ -z "$APK" ]; then
            echo "Reddit APK/APKM not found."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          curl -fsSL \
            "https://api.github.com/repos/${MORPHE_REPO}/releases/latest" |
          jq -r '
            .assets[]
            | select(.name | endswith("-all.jar"))
            | .browser_download_url
          ' |
          head -n 1 |
          xargs -I {} curl -fL {} -o tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version

      - name: Patch Reddit
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          java -jar tools/morphe-desktop.jar patch \
            --patches "https://github.com/${PATCHES_REPO}" \
            --prerelease \
            --striplibs "${ARCH}" \
            --bytecode-mode STRIP_SAFE \
            --continue-on-error \
            --result-file "output/reddit-result.json" \
            -o "output/Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-Dev-ARM64.apk" \
            "${{ steps.reddit_apk.outputs.apk }}"

      - name: Verify output
        shell: bash
        run: |
          test -s \
            "output/Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-Dev-ARM64.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Reddit-${{ needs.detect.outputs.reddit_version }}-Morphe-Dev-ARM64
          path: |
            output/*.apk
            output/*.json
          if-no-files-found: error


  # ---------------------------------------------------------
  # 4. Download latest stable MicroG-RE ARM64
  # ---------------------------------------------------------
  microg:
    name: Latest MicroG-RE ARM64
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Download latest MicroG-RE ARM64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          RELEASE_JSON="$(curl -fsSL \
            "https://api.github.com/repos/${MICROG_REPO}/releases/latest")"

          URL="$(echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(.name | test("arm64-v8a\\.apk$"))
              | .browser_download_url
            ' |
            head -n 1)"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Latest stable MicroG-RE ARM64 APK not found."
            exit 1
          fi

          NAME="$(basename "$URL")"

          curl -fL "$URL" \
            -o "output/$NAME"

          echo "Downloaded:"
          ls -lh output/

      - name: Upload MicroG
        uses: actions/upload-artifact@v6
        with:
          name: MicroG-RE-ARM64
          path: output/*.apk
          if-no-files-found: error


  # ---------------------------------------------------------
  # 5. Combined GitHub Release
  # ---------------------------------------------------------
  release:
    name: Create Combined Release
    needs:
      - detect
      - youtube
      - reddit
      - microg

    runs-on: ubuntu-latest

    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          echo "========== RELEASE ASSETS =========="
          find release-assets -type f -printf '%p\n' | sort

      - name: Create release metadata
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          # Morphe Dev ARM64 Bundle

          **Morphe Patches:** ${{ needs.detect.outputs.patch_tag }}

          **Morphe Desktop:** ${{ needs.detect.outputs.desktop_tag }}

          **MicroG-RE:** ${{ needs.detect.outputs.microg_tag }}

          ## Included

          - YouTube stable versions supported by current Morphe dev patches
          - YouTube experimental versions supported by current Morphe dev patches
          - Latest Reddit experimental target supported by current Morphe dev patches
          - Latest stable MicroG-RE ARM64
          - All patched APKs are ARM64 (`arm64-v8a`)

          ## Patch source

          Morphe official development/pre-release patches:
          https://github.com/${PATCHES_REPO}

          ## Notes

          YouTube and Reddit builds are generated automatically from the
          versions currently declared compatible by the Morphe patch metadata.

          Experimental builds may be less stable than stable-target builds.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "morphe-dev-${{ needs.detect.outputs.patch_tag }}"
          name: "Morphe Dev ${{ needs.detect.outputs.patch_tag }} - ARM64 Bundle"
          body_path: release-notes.md
          prerelease: true
          generate_release_notes: false
          files: |
            release-assets/**/*.apk
            release-assets/**/*.json
