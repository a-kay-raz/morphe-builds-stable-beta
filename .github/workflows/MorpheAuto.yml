      - name: Detect latest Morphe Dev patch
        id: patch_check
        shell: bash
        run: |
          set -e

          echo "Checking latest Morphe Dev patch..."

          PATCH_VERSION="$(
            curl -fsSL \
              "https://api.github.com/repos/MorpheApp/morphe-patches/releases?per_page=100" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(
                    .tag_name
                    | test("^v[0-9]+[.][0-9]+[.][0-9]+-dev[.][0-9]+$")
                  )
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_VERSION" ] || [ "$PATCH_VERSION" = "null" ]; then
            echo "ERROR: Could not detect latest Morphe Dev patch."
            exit 1
          fi

          PATCH_VERSION="${PATCH_VERSION#v}"

          echo "Latest Morphe Dev patch:"
          echo "$PATCH_VERSION"

          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"

          if [ -f ".morphe-patch-version" ]; then
            CURRENT_PATCH="$(cat .morphe-patch-version)"
          else
            CURRENT_PATCH=""
          fi

          echo "Current recorded patch:"
          echo "${CURRENT_PATCH:-none}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run detected."
            echo "Forcing build."

            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PATCH_VERSION" = "$CURRENT_PATCH" ]; then
            echo ""
            echo "No new Morphe Dev patch."
            echo "Current: $CURRENT_PATCH"
            echo "Latest: $PATCH_VERSION"

            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "NEW MORPHE DEV PATCH DETECTED!"
          echo "Old: ${CURRENT_PATCH:-none}"
          echo "New: $PATCH_VERSION"

          echo "changed=true" >> "$GITHUB_OUTPUT"
