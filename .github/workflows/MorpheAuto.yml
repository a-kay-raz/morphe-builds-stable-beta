name: Auto Morphe Beta → YouTube + Reddit → ARM64 Release

on:
  workflow_dispatch:

  schedule:
    # Every day at 10:00 AM IST
    # 04:30 UTC
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      MORPHE_REPO: "MorpheApp/morphe-desktop"
      PATCHES_REPO: "https://github.com/MorpheApp/morphe-patches"
      PATCHES_JSON: "https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/patches-list.json"
      MICROG_REPO: "microg/GmsCore"

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # DETECT LATEST MORPHE DEV PATCH
      # =====================================================

      - name: Detect latest Morphe Dev patch
        id: patch_check
        shell: bash
        run: |
          set -e

          echo "Checking latest Morphe Dev patch..."

          PATCH_VERSION="$(
            curl -fsSL \
              "https://api.github.com/repos/MorpheApp/morphe-patches/releases?per_page=100" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.tag_name | test("^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$"))
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_VERSION" ] || [ "$PATCH_VERSION" = "null" ]; then
            echo "ERROR: Morphe Dev patch not found."
            exit 1
          fi

          PATCH_VERSION="${PATCH_VERSION#v}"

          echo "Latest Morphe Dev patch: $PATCH_VERSION"
          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"

          if [ -f ".morphe-patch-version" ]; then
            CURRENT_PATCH="$(cat .morphe-patch-version)"
          else
            CURRENT_PATCH=""
          fi

          echo "Recorded patch: ${CURRENT_PATCH:-none}"

          # Manual run = always build
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - forcing build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled run
          if [ "$PATCH_VERSION" = "$CURRENT_PATCH" ]; then
            echo "No new Morphe patch."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New Morphe patch detected."
          echo "Old: ${CURRENT_PATCH:-none}"
          echo "New: $PATCH_VERSION"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      # =====================================================
      # STOP WHEN NOTHING CHANGED
      # =====================================================

      - name: Stop if no new patch
        if: steps.patch_check.outputs.changed != 'true'
        run: |
          echo "No new Morphe patch."
          echo "Skipping build."

      # =====================================================
      # JAVA 21
      # =====================================================

      - name: Setup Java 21
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # =====================================================
      # DOWNLOAD APKMIRROR DOWNLOADER
      # =====================================================

      - name: Download APKMirror downloader
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          mkdir -p tools downloads output results

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          APKMD_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(.name == "apkmd")
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: APKMD not found."
            exit 1
          fi

          curl -fL "$APKMD_URL" -o tools/apkmd

          chmod +x tools/apkmd

          ./tools/apkmd --help

      # =====================================================
      # DOWNLOAD MORPHE DESKTOP DEV
      # =====================================================

      - name: Download Morphe Desktop Dev
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${MORPHE_REPO}/releases?per_page=100"

          MORPHE_URL="$(
            curl -fsSL "$API" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | .assets[]
                | select(.name | test("morphe-desktop-.*-all\\.jar$"))
                | {
                    url: .browser_download_url,
                    date: (.created_at // "")
                  }
              ]
              | sort_by(.date)
              | last
              | .url
            '
          )"

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop Dev JAR not found."
            exit 1
          fi

          curl -fL "$MORPHE_URL" \
            -o tools/morphe-desktop.jar

          echo "Morphe Desktop:"
          ls -lh tools/morphe-desktop.jar

      # =====================================================
      # DOWNLOAD LATEST OFFICIAL MICROG GMSCORE
      # =====================================================

      - name: Download latest official microG GmsCore
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          mkdir -p microg

          API="https://api.github.com/repos/${MICROG_REPO}/releases/latest"

          echo "Getting latest official microG GmsCore..."

          MICROG_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(
                  .name
                  | test("^com\\.google\\.android\\.gms-[0-9]+\\.apk$")
                )
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$MICROG_URL" ] || [ "$MICROG_URL" = "null" ]; then
            echo "ERROR: Official microG GmsCore APK not found."
            exit 1
          fi

          echo "microG URL:"
          echo "$MICROG_URL"

          curl -fL "$MICROG_URL" \
            -o microg/microG-GmsCore.apk

          echo ""
          echo "microG GmsCore:"
          ls -lh microg/microG-GmsCore.apk

          echo ""
          echo "microG version:"
          curl -fsSL "$API" |
            jq -r '.tag_name'

          echo "MICROG_VERSION=$(
            curl -fsSL "$API" |
            jq -r '.tag_name'
          )" >> "$GITHUB_ENV"

      # =====================================================
      # DOWNLOAD MORPHE PATCH METADATA
      # =====================================================

      - name: Download Morphe patch metadata
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          curl -fsSL "$PATCHES_JSON" \
            -o patches-list.json

          echo "Morphe patch metadata downloaded."

      # =====================================================
      # DETECT YOUTUBE VERSIONS
      # =====================================================

      - name: Detect YouTube versions
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "YouTube versions"
          echo "========================================="

          jq -r '
            [
              .patches[]
              | .compatiblePackages[]?
              | select(.packageName == "com.google.android.youtube")
              | .targets[]?
              | select(.isExperimental == true)
              | .version
              | select(type == "string")
            ]
            | unique
            | sort_by(split(".") | map(tonumber))
            | reverse
            | .[]
          ' patches-list.json > youtube-experimental.txt

          jq -r '
            [
              .patches[]
              | .compatiblePackages[]?
              | select(.packageName == "com.google.android.youtube")
              | .targets[]?
              | select(.isExperimental == false)
              | .version
              | select(type == "string")
            ]
            | unique
            | sort_by(split(".") | map(tonumber))
            | reverse
            | .[]
          ' patches-list.json > youtube-stable.txt

          echo "Experimental:"
          cat youtube-experimental.txt

          echo ""
          echo "Stable:"
          cat youtube-stable.txt

          if [ ! -s youtube-experimental.txt ]; then
            echo "ERROR: No YouTube experimental version found."
            exit 1
          fi

          if [ ! -s youtube-stable.txt ]; then
            echo "ERROR: No YouTube stable version found."
            exit 1
          fi

      # =====================================================
      # DETECT REDDIT VERSIONS
      # =====================================================

      - name: Detect Reddit versions
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Reddit versions"
          echo "========================================="

          jq -r '
            [
              .patches[]
              | .compatiblePackages[]?
              | select(.packageName == "com.reddit.frontpage")
              | .targets[]?
              | select(.isExperimental == true)
              | .version
              | select(type == "string")
            ]
            | unique
            | .[]
          ' patches-list.json |
          sort -V -r > reddit-experimental.txt

          jq -r '
            [
              .patches[]
              | .compatiblePackages[]?
              | select(.packageName == "com.reddit.frontpage")
              | .targets[]?
              | select(.isExperimental == false)
              | .version
              | select(type == "string")
            ]
            | unique
            | .[]
          ' patches-list.json |
          sort -V -r > reddit-stable.txt

          echo "Experimental:"
          cat reddit-experimental.txt

          echo ""
          echo "Stable:"
          cat reddit-stable.txt

          if [ ! -s reddit-experimental.txt ]; then
            echo "ERROR: No Reddit experimental version found."
            exit 1
          fi

          if [ ! -s reddit-stable.txt ]; then
            echo "ERROR: No Reddit stable version found."
            exit 1
          fi

      # =====================================================
      # CREATE BUILD LIST
      #
      # YouTube:
      #   All experimental + latest stable
      #
      # Reddit:
      #   Latest experimental + latest stable
      # =====================================================

      - name: Create build list
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          : > build-list.txt

          # -----------------------------
          # YouTube experimental
          # -----------------------------

          while IFS= read -r VERSION; do
            [ -z "$VERSION" ] && continue
            echo "youtube|$VERSION|experimental" >> build-list.txt
          done < youtube-experimental.txt

          # Latest YouTube stable
          YT_STABLE="$(head -n 1 youtube-stable.txt)"

          echo "youtube|$YT_STABLE|stable" >> build-list.txt

          # -----------------------------
          # Reddit latest experimental
          # -----------------------------

          REDDIT_EXPERIMENTAL="$(head -n 1 reddit-experimental.txt)"

          echo "reddit|$REDDIT_EXPERIMENTAL|experimental" >> build-list.txt

          # Latest Reddit stable / recommended
          REDDIT_STABLE="$(head -n 1 reddit-stable.txt)"

          echo "reddit|$REDDIT_STABLE|stable" >> build-list.txt

          # Remove duplicate app/version combinations
          sort -u build-list.txt -o build-list.txt

          echo "========================================="
          echo "FINAL BUILD LIST"
          echo "========================================="

          cat build-list.txt

      # =====================================================
      # BUILD
      # =====================================================

      - name: Download and patch applications
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          mkdir -p output results

          while IFS='|' read -r APP VERSION CHANNEL; do

            echo ""
            echo "========================================="
            echo "Building: $APP"
            echo "Version : $VERSION"
            echo "Channel : $CHANNEL"
            echo "Morphe  : $PATCH_VERSION"
            echo "========================================="

            rm -rf downloads/*
            rm -f input.apk
            rm -f patched.apk
            rm -f result.json

            # ------------------------------------------------
            # APKMirror identifiers
            # ------------------------------------------------

            if [ "$APP" = "youtube" ]; then
              ORG="google-inc"
              REPO="youtube"
              PACKAGE="com.google.android.youtube"
              APP_NAME="YouTube"

            elif [ "$APP" = "reddit" ]; then
              ORG="reddit-inc"
              REPO="reddit"
              PACKAGE="com.reddit.frontpage"
              APP_NAME="Reddit"

            else
              echo "Unknown app: $APP"
              continue
            fi

            # ------------------------------------------------
            # APKMirror configuration
            # ------------------------------------------------

            cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "${ORG}",
                "repo": "${REPO}",
                "version": "${VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "${APP}-${VERSION}"
              }
            ]
          }
          EOF

            echo "Downloading ${APP_NAME} ${VERSION}..."

            if ! ./tools/apkmd apps.json; then
              echo "WARNING: APKMirror download failed."
              echo "Skipping ${APP_NAME} ${VERSION}."
              continue
            fi

            APK="$(
              find downloads \
                -type f \
                \( -name "*.apk" -o -name "*.apkm" \) |
              head -n 1
            )"

            if [ -z "$APK" ]; then
              echo "WARNING: APK/APKM not found."
              continue
            fi

            cp "$APK" input.apk

            echo ""
            echo "Downloaded:"
            ls -lh input.apk

            # ------------------------------------------------
            # Patch with Morphe Beta
            # ------------------------------------------------

            FINAL_NAME="${APP}-${VERSION}-Morphe-Beta-${PATCH_VERSION}.apk"

            echo ""
            echo "Patching with Morphe Beta..."

            if ! java -jar tools/morphe-desktop.jar \
              patch \
              -p "$PATCHES_REPO" \
              --prerelease \
              -o patched.apk \
              -r result.json \
              --striplibs "arm64-v8a" \
              --bytecode-mode "STRIP_SAFE" \
              input.apk
            then
              echo "WARNING: Morphe patch failed."
              echo "Skipping ${APP_NAME} ${VERSION}."
              continue
            fi

            if [ ! -f patched.apk ]; then
              echo "WARNING: patched.apk was not created."
              continue
            fi

            # ------------------------------------------------
            # Zipalign FINAL patched APK
            # ------------------------------------------------

            ZIPALIGN="$(
              find "$ANDROID_HOME/build-tools" \
                -type f \
                -name "zipalign" |
              sort -V |
              tail -n 1
            )"

            if [ -z "$ZIPALIGN" ]; then
              echo "ERROR: zipalign not found."
              exit 1
            fi

            echo ""
            echo "Zipaligning final APK..."

            "$ZIPALIGN" \
              -p \
              -f \
              4 \
              patched.apk \
              "output/${FINAL_NAME}"

            "$ZIPALIGN" \
              -c \
              -v \
              4 \
              "output/${FINAL_NAME}"

            # ------------------------------------------------
            # Save result JSON
            # ------------------------------------------------

            if [ -f result.json ]; then
              cp result.json \
                "results/${APP}-${VERSION}-result.json"
            fi

            echo ""
            echo "SUCCESS:"
            ls -lh "output/${FINAL_NAME}"

          done < build-list.txt

      # =====================================================
      # VERIFY APKs
      # =====================================================

      - name: Verify generated APKs
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Generated APKs"
          echo "========================================="

          find output \
            -type f \
            -name "*.apk" \
            -print

          COUNT="$(
            find output \
              -type f \
              -name "*.apk" |
            wc -l
          )"

          echo ""
          echo "APK count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      # =====================================================
      # UPLOAD ARTIFACTS
      # =====================================================

      - name: Upload all APKs
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-Beta-ARM64-${{ env.PATCH_VERSION }}
          path: output/*.apk
          if-no-files-found: error

      - name: Upload patch results
        if: steps.patch_check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-results-${{ env.PATCH_VERSION }}
          path: results/*.json
          if-no-files-found: warn

      # =====================================================
      # CREATE INDIVIDUAL RELEASES
      # =====================================================

      - name: Create GitHub releases
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          for APK in output/*.apk; do

            [ -f "$APK" ] || continue

            FILE="$(basename "$APK")"
            BASE="${FILE%.apk}"

            echo ""
            echo "========================================="
            echo "Creating release"
            echo "$BASE"
            echo "========================================="

            gh release create \
              "$BASE" \
              "$APK" \
              "microg/microG-GmsCore.apk" \
              --title "$BASE" \
              --prerelease \
              --notes \
          "Morphe Beta ARM64 build

          App:
          ${BASE}

          Morphe Dev Patches:
          ${PATCH_VERSION}

          Architecture:
          ARM64-v8a

          APK source:
          APKMirror

          Official microG GmsCore:
          ${MICROG_VERSION}

          microG GmsCore is included as a separate release asset.

          Build:
          Automatic Morphe Beta build."

          done

      # =====================================================
      # SAVE PATCH VERSION
      # =====================================================

      - name: Save Morphe patch version
        if: steps.patch_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          echo "$PATCH_VERSION" > .morphe-patch-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .morphe-patch-version

          if git diff --cached --quiet; then
            echo "Patch version already saved."
            exit 0
          fi

          git commit \
            -m "chore: update Morphe patch to ${PATCH_VERSION}"

          git push
