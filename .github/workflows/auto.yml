name: Build YT + Reddit Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. YOUTUBE EXPERIMENTAL + MORPHE DEV
  # ============================================================
  yt-experimental-morphe:
    name: YouTube Experimental - Morphe Dev
    runs-on: ubuntu-latest

    env:
      APP_NAME: YouTube
      PACKAGE_NAME: com.google.android.youtube
      APK_ORG: google-inc
      APK_REPO: youtube
      PATCH_REPO: https://github.com/MorpheApp/morphe-patches
      BUILD_NAME: YT-Morphe-Dev-Experimental

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Verify Java
        run: java -version

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      # ----------------------------------------------------------
      # Download latest Morphe Desktop
      # ----------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          URL="$(
            curl -fsSL \
              https://api.github.com/repos/MorpheApp/morphe-desktop/releases |
            jq -r '
              [
                .[]
                | select(.draft == false)
                | .assets[]
                | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              ][0].browser_download_url
            '
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Morphe Desktop JAR not found."
            exit 1
          fi

          curl -fL --retry 5 --retry-delay 5 \
            "$URL" \
            -o tools/morphe-desktop.jar

          test -s tools/morphe-desktop.jar

          java -jar tools/morphe-desktop.jar --version

      # ----------------------------------------------------------
      # Detect latest compatible experimental version
      # ----------------------------------------------------------
      - name: Detect compatible version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          java -jar tools/morphe-desktop.jar \
            list-versions \
            --patches "$PATCH_REPO" \
            --prerelease \
            --filter-package-names "$PACKAGE_NAME" \
            --include-experimental \
            > versions.txt

          cat versions.txt

          VERSION="$(
            grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' versions.txt |
            head -n 1
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::No compatible YouTube experimental version found."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Selected YouTube version: $VERSION"

      # ----------------------------------------------------------
      # Download YouTube ARM64 APK
      # ----------------------------------------------------------
      - name: Download YouTube APK
        id: apk
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        continue-on-error: true
        with:
          org: google-inc
          repo: youtube
          version: ${{ env.VERSION }}
          bundle: false
          filename: youtube-original.apk
          overwrite: true

      - name: Retry YouTube APK download
        if: steps.apk.outcome != 'success'
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: google-inc
          repo: youtube
          version: ${{ env.VERSION }}
          bundle: false
          filename: youtube-original.apk
          overwrite: true

      - name: Verify YouTube APK
        shell: bash
        run: |
          set -euo pipefail

          test -s youtube-original.apk
          unzip -t youtube-original.apk >/dev/null

      # ----------------------------------------------------------
      # Patch
      # ----------------------------------------------------------
      - name: Patch YouTube
        shell: bash
        run: |
          set -euo pipefail

          java -jar tools/morphe-desktop.jar \
            patch \
            --patches "$PATCH_REPO" \
            --prerelease \
            --out "${BUILD_NAME}-${VERSION}.apk" \
            youtube-original.apk

          test -s "${BUILD_NAME}-${VERSION}.apk"

      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ env.VERSION }}
          path: ${{ env.BUILD_NAME }}-${{ env.VERSION }}.apk
          if-no-files-found: error


  # ============================================================
  # 2. REDDIT EXPERIMENTAL + MORPHE DEV
  # ============================================================
  reddit-experimental-morphe:
    name: Reddit Experimental - Morphe Dev
    runs-on: ubuntu-latest

    env:
      APP_NAME: Reddit
      PACKAGE_NAME: com.reddit.frontpage
      PATCH_REPO: https://github.com/MorpheApp/morphe-patches
      BUILD_NAME: Reddit-Morphe-Dev-Experimental

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Verify Java
        run: java -version

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      # ----------------------------------------------------------
      # Morphe
      # ----------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          URL="$(
            curl -fsSL \
              https://api.github.com/repos/MorpheApp/morphe-desktop/releases |
            jq -r '
              [
                .[]
                | select(.draft == false)
                | .assets[]
                | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              ][0].browser_download_url
            '
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Morphe Desktop JAR not found."
            exit 1
          fi

          curl -fL --retry 5 --retry-delay 5 \
            "$URL" \
            -o tools/morphe-desktop.jar

          test -s tools/morphe-desktop.jar

      # ----------------------------------------------------------
      # Reddit version
      # ----------------------------------------------------------
      - name: Detect Reddit experimental version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          java -jar tools/morphe-desktop.jar \
            list-versions \
            --patches "$PATCH_REPO" \
            --prerelease \
            --filter-package-names "$PACKAGE_NAME" \
            --include-experimental \
            > versions.txt

          cat versions.txt

          VERSION="$(
            grep -Eo '[0-9]{4}\.[0-9]+\.[0-9]+' versions.txt |
            head -n 1
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::No compatible Reddit experimental version found."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Selected Reddit version: $VERSION"

      # ----------------------------------------------------------
      # Reddit APKM
      # ----------------------------------------------------------
      - name: Download Reddit bundle
        id: apk
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        continue-on-error: true
        with:
          org: reddit-inc
          repo: reddit
          version: ${{ env.VERSION }}
          bundle: true
          filename: reddit-original.apkm
          overwrite: true

      - name: Retry Reddit download
        if: steps.apk.outcome != 'success'
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        with:
          org: reddit-inc
          repo: reddit
          version: ${{ env.VERSION }}
          bundle: true
          filename: reddit-original.apkm
          overwrite: true

      - name: Verify Reddit bundle
        shell: bash
        run: |
          set -euo pipefail

          test -s reddit-original.apkm
          unzip -t reddit-original.apkm >/dev/null

      # ----------------------------------------------------------
      # Patch Reddit
      # ----------------------------------------------------------
      - name: Patch Reddit
        shell: bash
        run: |
          set -euo pipefail

          java -jar tools/morphe-desktop.jar \
            patch \
            --patches "$PATCH_REPO" \
            --prerelease \
            --out "${BUILD_NAME}-${VERSION}.apk" \
            reddit-original.apkm

          test -s "${BUILD_NAME}-${VERSION}.apk"

      - name: Upload Reddit APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ env.VERSION }}
          path: ${{ env.BUILD_NAME }}-${{ env.VERSION }}.apk
          if-no-files-found: error


  # ============================================================
  # 3. YOUTUBE + ANDDEA DEV
  # ============================================================
  yt-anddea-dev:
    name: YouTube - Anddea Dev
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.google.android.youtube
      PATCH_REPO: https://github.com/anddea/revanced-patches/tree/dev
      BUILD_NAME: YT-Anddea-Dev

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Verify Java
        run: java -version

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      # ----------------------------------------------------------
      # Morphe Desktop
      # ----------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          URL="$(
            curl -fsSL \
              https://api.github.com/repos/MorpheApp/morphe-desktop/releases |
            jq -r '
              [
                .[]
                | select(.draft == false)
                | .assets[]
                | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              ][0].browser_download_url
            '
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Morphe Desktop JAR not found."
            exit 1
          fi

          curl -fL --retry 5 --retry-delay 5 \
            "$URL" \
            -o tools/morphe-desktop.jar

          test -s tools/morphe-desktop.jar

      # ----------------------------------------------------------
      # Anddea Dev compatible version
      # ----------------------------------------------------------
      - name: Detect Anddea compatible version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          java -jar tools/morphe-desktop.jar \
            list-versions \
            --patches "$PATCH_REPO" \
            --prerelease \
            --filter-package-names "$PACKAGE_NAME" \
            > versions.txt

          cat versions.txt

          VERSION="$(
            grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' versions.txt |
            head -n 1
          )"

          if [ -z "$VERSION" ]; then
            echo "::error::No compatible YouTube version found for Anddea Dev."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Selected YouTube version: $VERSION"

      # ----------------------------------------------------------
      # Download YouTube
      # ----------------------------------------------------------
      - name: Download YouTube APK
        id: apk
        uses: Yakov5776/gh-apkmirror-dl@v1.3
        continue-on-error: true
        with:
          org: google-inc
          repo: youtube
          version: ${{ env.VERSION }}
          bundle: false
